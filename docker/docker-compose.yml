# Переводчик HU→RU: один сервис. Запуск из папки docker/:  docker compose up -d
# Данные (база, задачи, кэш портала, ключ) — в ../data, проекты с глоссариями — в ../projects.
services:
  hut:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hut:latest
    container_name: hut
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HUT_PORT:-8010}:8010"
    volumes:
      - ../data:/app/data
      - ../projects:/app/projects
    logging:                      # без ротации логи съедают диск (урок конвертера: 9 ГБ логов CVAT)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
