<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Замены шрифтов Word при печати PDF из DOCX (LibreOffice в образе): без них LibreOffice брал шрифт с засечками
     для Verdana (название на титуле UTS, 16.10). Tahoma — копия из fonts-wine, Arial/Times/Courier — Liberation
     (метрические копии, свои правила fontconfig), Calibri/Cambria — Carlito/Caladea. Symbol/Wingdings (маркеры
     списков) — не копии из Wine: у них другие знаки на тех же кодах; LibreOffice перекодирует их в OpenSymbol. -->
<fontconfig>
  <!-- Tahoma Bold из Wine рисуется тонкой и разреженной (не похожа на полужирный) — полужирная Tahoma = DejaVu Sans Bold -->
  <match target="pattern">
    <test qual="any" name="family"><string>Tahoma</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <alias binding="strong"><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Consolas</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="strong"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
