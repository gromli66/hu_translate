{% extends "base.html" %}
{% block title %}Вход — Переводчик HU→RU{% endblock %}
{% block content %}
<article class="narrow">
  <h2>Вход</h2>
  {% if error %}<p class="msg warn" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Логин <input name="login" autocomplete="username" required autofocus value="{{ login or '' }}"></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Войти</button>
  </form>
  <small class="muted">Учётную запись выдаёт администратор.</small>
</article>
{% endblock %}
