# Переводчик HU→RU. Управляется скриптами ./install.sh и ./hut — вручную менять не нужно.
services:
  hut:
    image: hut:latest
    container_name: hut
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HUT_PORT:-8010}:8010"
    volumes:
      - ./data:/app/data             # база, переводы, кэш портала, копии базы — сохранять эту папку
      - ./projects:/app/projects     # проекты с глоссариями заказчика
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
